name: Submit an example
description: Share a documented sign, label or translation that says something other than intended.
title: "Example: "
body:
  - type: input
    id: source
    attributes:
      label: Source link
      description: Link to the original post or a reliable report, preferably with a photo.
    validations:
      required: true
  - type: input
    id: language
    attributes:
      label: Language
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Kind of fail
      options:
        - Direction
        - Layout
        - Flipped
        - Look-alike
        - Typo
        - Wording
        - Unfamiliar
        - Translation
        - Damage
    validations:
      required: true
  - type: textarea
    id: readings
    attributes:
      label: Intended and accidental readings
      description: Tell us how the item is meant to be read, what it accidentally says, and why the unintended reading is funny.
    validations:
      required: true
  - type: textarea
    id: credit
    attributes:
      label: Image credit or other context
