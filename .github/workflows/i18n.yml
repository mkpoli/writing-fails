name: i18n

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build
      - name: Generated pages match the catalogues
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
